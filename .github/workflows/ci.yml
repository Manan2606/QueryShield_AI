name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate migrations with SQLite
        env:
          APP_ENV: ci
          DATABASE_URL: sqlite:///./ci_queryshield.db
          JWT_SECRET_KEY: ci-only-secret
          GEMINI_API_KEY: ""
          GCP_PROJECT_ID: ""
          STORAGE_BACKEND: local
          AI_SUMMARY_ENABLED: "false"
        run: python -m alembic upgrade head

      - name: Run backend tests
        env:
          APP_ENV: ci
          DATABASE_URL: sqlite:///./ci_queryshield.db
          JWT_SECRET_KEY: ci-only-secret
          GEMINI_API_KEY: ""
          GCP_PROJECT_ID: ""
          STORAGE_BACKEND: local
          AI_SUMMARY_ENABLED: "false"
        run: python -m pytest

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint if configured
        shell: bash
        run: |
          if npm run | grep -q "  lint"; then
            npm run lint
          else
            echo "No frontend lint script configured; skipping."
          fi

      - name: Run chart inference tests
        run: npm run test:charts

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t queryshield-backend:ci backend

      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 -f frontend/Dockerfile -t queryshield-frontend:ci frontend